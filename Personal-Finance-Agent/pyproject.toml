[project]
name = "agent-financial-management"
version = "0.1.0"
description = "Local-first personal finance agent from bank emails to Excel and Telegram insights."
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
  "python-dotenv>=1.0.0",
  "google-api-python-client>=2.140.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
finance-agent = "finance_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
